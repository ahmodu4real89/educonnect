version: "3.9"

services:
  db:
    image: postgres:15
    container_name: nextjs-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nextjs-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dev:dev@db:5432/devdb
    depends_on:
      - db
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  postgres_data:
